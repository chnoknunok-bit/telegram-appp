<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>СК МЕТРОШОП</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #111318;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    button {
      font: inherit;
      border: 0;
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
      padding-bottom: 90px;
    }

    .header {
      padding: 22px 18px 14px;
      background: #171920;
      border-bottom: 1px solid #292c35;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
    }

    .subtitle {
      margin-top: 5px;
      color: #8e94a3;
      font-size: 13px;
    }

    .page {
      display: none;
      padding: 18px;
    }

    .page.active {
      display: block;
    }

    .balance {
      background: #1c1f28;
      border: 1px solid #2b2f39;
      border-radius: 16px;
      padding: 17px;
      margin-bottom: 18px;
    }

    .balance-title {
      color: #9298a7;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .balance-value {
      font-size: 28px;
      font-weight: 800;
    }

    .product {
      background: #1b1e26;
      border: 1px solid #2b2f39;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .product-name {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 10px;
    }

    .product-price {
      color: #b5bbc9;
      font-size: 14px;
      margin-bottom: 13px;
    }

    .buy-btn {
      width: 100%;
      padding: 13px;
      border-radius: 11px;
      background: #5865f2;
      color: white;
      font-weight: 700;
    }

    .buy-btn:active {
      opacity: .8;
    }

    .empty {
      text-align: center;
      padding: 45px 15px;
      color: #858b99;
    }

    .error {
      background: #291b1e;
      border: 1px solid #573137;
      color: #ff9ca6;
      border-radius: 12px;
      padding: 13px;
      margin-bottom: 14px;
      font-size: 14px;
      display: none;
    }

    .loading {
      text-align: center;
      color: #858b99;
      padding: 30px 10px;
    }

    .profile-card {
      background: #1b1e26;
      border: 1px solid #2b2f39;
      border-radius: 16px;
      padding: 17px;
    }

    .profile-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 12px 0;
      border-bottom: 1px solid #292c35;
    }

    .profile-row:last-child {
      border-bottom: 0;
    }

    .profile-label {
      color: #8f95a4;
    }

    .profile-value {
      text-align: right;
      font-weight: 700;
      word-break: break-word;
    }

    .history-item {
      background: #1b1e26;
      border: 1px solid #2b2f39;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
    }

    .history-name {
      font-weight: 700;
      margin-bottom: 6px;
    }

    .history-info {
      color: #9298a7;
      font-size: 13px;
      line-height: 1.5;
    }

    .nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 76px;
      background: #171920;
      border-top: 1px solid #292c35;
      display: flex;
      z-index: 9999;
    }

    .nav-btn {
      flex: 1;
      background: transparent;
      color: #777d8c;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 12px;
    }

    .nav-btn .icon {
      font-size: 21px;
    }

    .nav-btn.active {
      color: #fff;
    }

    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 10000;
    }

    .modal-bg.show {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 420px;
      background: #1b1e26;
      border: 1px solid #303440;
      border-radius: 18px;
      padding: 20px;
    }

    .modal-title {
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 15px;
    }

    .input {
      width: 100%;
      background: #111318;
      color: #fff;
      border: 1px solid #303440;
      border-radius: 11px;
      padding: 13px;
      outline: none;
      margin-bottom: 12px;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
    }

    .modal-buttons button {
      flex: 1;
      padding: 13px;
      border-radius: 11px;
    }

    .confirm {
      background: #5865f2;
      color: white;
      font-weight: 700;
    }

    .cancel {
      background: #2b2f39;
      color: white;
    }

    .toast {
      position: fixed;
      left: 18px;
      right: 18px;
      bottom: 90px;
      background: #242832;
      border: 1px solid #363b48;
      border-radius: 12px;
      padding: 13px;
      text-align: center;
      z-index: 20000;
      display: none;
    }

    .toast.show {
      display: block;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">СК МЕТРОШОП</div>
    <div class="subtitle">Магазин за POINT</div>
  </div>

  <!-- МАГАЗИН -->
  <section id="page-shop" class="page active">

    <div class="balance">
      <div class="balance-title">Ваш баланс</div>
      <div class="balance-value">
        <span id="shopBalance">0</span> POINT
      </div>
    </div>

    <div id="shopError" class="error"></div>

    <div id="products">
      <div class="loading">Загрузка товаров...</div>
    </div>

  </section>

  <!-- ИСТОРИЯ -->
  <section id="page-history" class="page">

    <h2>История</h2>

    <div id="historyError" class="error"></div>

    <div id="history">
      <div class="loading">Загрузка истории...</div>
    </div>

  </section>

  <!-- ПРОФИЛЬ -->
  <section id="page-profile" class="page">

    <h2>Профиль</h2>

    <div id="profileError" class="error"></div>

    <div class="profile-card">

      <div class="profile-row">
        <div class="profile-label">Имя</div>
        <div id="profileName" class="profile-value">—</div>
      </div>

      <div class="profile-row">
        <div class="profile-label">Username</div>
        <div id="profileUsername" class="profile-value">—</div>
      </div>

      <div class="profile-row">
        <div class="profile-label">Telegram ID</div>
        <div id="profileId" class="profile-value">—</div>
      </div>

      <div class="profile-row">
        <div class="profile-label">Баланс</div>
        <div id="profileBalance" class="profile-value">0 POINT</div>
      </div>

    </div>

  </section>

</div>

<!-- НИЖНЕЕ МЕНЮ -->
<nav class="nav">

  <button
    type="button"
    class="nav-btn active"
    id="nav-shop"
    onclick="openPage('shop')"
  >
    <span class="icon">🛒</span>
    <span>Магазин</span>
  </button>

  <button
    type="button"
    class="nav-btn"
    id="nav-history"
    onclick="openPage('history')"
  >
    <span class="icon">📋</span>
    <span>История</span>
  </button>

  <button
    type="button"
    class="nav-btn"
    id="nav-profile"
    onclick="openPage('profile')"
  >
    <span class="icon">👤</span>
    <span>Профиль</span>
  </button>

</nav>

<!-- МОДАЛКА ПОКУПКИ -->
<div id="buyModal" class="modal-bg">

  <div class="modal">

    <div id="modalTitle" class="modal-title">
      Покупка
    </div>

    <input
      id="playerId"
      class="input"
      type="text"
      placeholder="Введите игровой ID"
      autocomplete="off"
    >

    <div class="modal-buttons">

      <button
        type="button"
        class="cancel"
        onclick="closeBuyModal()"
      >
        Отмена
      </button>

      <buttontype="button"
        class="confirm"
        onclick="confirmBuy()"
      >
        Купить
      </button>

    </div>

  </div>

</div>

<div id="toast" class="toast"></div>

<script>
  "use strict";

  const API = "https://telegram-appp.onrender.com";

  let products = [];
  let selectedProduct = null;

  const tg = window.Telegram && window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;

  if (tg) {
    try {
      tg.ready();
      tg.expand();
    } catch (e) {
      console.log("Telegram WebApp init:", e);
    }
  }

  /*
   * ----------------------------------------------------
   * НАВИГАЦИЯ
   * ----------------------------------------------------
   *
   * ВАЖНО:
   * Эти функции вообще не зависят от API.
   * Поэтому вкладки должны переключаться даже
   * если сервер недоступен.
   */

  function openPage(page) {

    console.log("OPEN PAGE:", page);

    const pages = ["shop", "history", "profile"];

    pages.forEach(function(name) {

      const element = document.getElementById("page-" + name);
      const button = document.getElementById("nav-" + name);

      if (!element || !button) {
        return;
      }

      if (name === page) {
        element.classList.add("active");
        button.classList.add("active");
      } else {
        element.classList.remove("active");
        button.classList.remove("active");
      }

    });

    if (page === "history") {
      loadHistory();
    }

    if (page === "profile") {
      loadProfile();
    }

  }

  /*
   * ----------------------------------------------------
   * FETCH С ТАЙМАУТОМ
   * ----------------------------------------------------
   */

  async function fetchWithTimeout(url, options = {}, timeout = 8000) {

    const controller = new AbortController();

    const timer = setTimeout(function() {
      controller.abort();
    }, timeout);

    try {

      const response = await fetch(url, {
        ...options,
        signal: controller.signal
      });

      clearTimeout(timer);

      return response;

    } catch (error) {

      clearTimeout(timer);

      throw error;
    }
  }

  /*
   * ----------------------------------------------------
   * TELEGRAM INIT DATA
   * ----------------------------------------------------
   */

  function getInitData() {

    if (
      tg &&
      typeof tg.initData === "string" &&
      tg.initData.length > 0
    ) {
      return tg.initData;
    }

    return "";
  }

  /*
   * ----------------------------------------------------
   * ПРОДУКТЫ
   * ----------------------------------------------------
   */

  async function loadProducts() {

    const container = document.getElementById("products");
    const error = document.getElementById("shopError");

    error.style.display = "none";

    container.innerHTML =
      '<div class="loading">Загрузка товаров...</div>';

    try {

      const response = await fetchWithTimeout(
        API + "/api/products",
        {
          method: "GET"
        },
        8000
      );

      if (!response.ok) {
        throw new Error(
          "Сервер вернул HTTP " + response.status
        );
      }

      const data = await response.json();

      console.log("PRODUCTS:", data);

      if (!data.ok) {
        throw new Error(
          data.error || "Не удалось получить товары"
        );
      }

      products = Array.isArray(data.products)
        ? data.products
        : [];

      renderProducts();

    } catch (err) {

      console.error("PRODUCTS ERROR:", err);

      container.innerHTML = `
        <div class="empty">
          Не удалось загрузить товары.

          ${escapeHtml(err.message || "Ошибка")}
        </div>
      `;

      error.textContent =
        "Ошибка загрузки товаров: " +
        (err.message || "неизвестная ошибка");

      error.style.display = "block";
    }

  }

  function renderProducts() {

    const container = document.getElementById("products");

    if (!products.length) {

      container.innerHTML = `<div class="empty">
          Товаров пока нет.
        </div>
      `;

      return;
    }

    container.innerHTML = "";

    products.forEach(function(product) {

      const card = document.createElement("div");

      card.className = "product";

      const priceText =
        Number(product.price) > 0
          ? Number(product.price) + " POINT"
          : "Цена пока не установлена";

      card.innerHTML = `
        <div class="product-name">
          ${escapeHtml(product.name)}
        </div>

        <div class="product-price">
          ${escapeHtml(priceText)}
        </div>

        <button
          type="button"
          class="buy-btn"
          data-product-id="${escapeHtml(product.id)}"
        >
          Купить
        </button>
      `;

      const button = card.querySelector(".buy-btn");

      button.addEventListener("click", function() {

        openBuyModal(product);

      });

      container.appendChild(card);

    });

  }

  /*
   * ----------------------------------------------------
   * ПОКУПКА
   * ----------------------------------------------------
   */

  function openBuyModal(product) {

    selectedProduct = product;

    document.getElementById("modalTitle").textContent =
      "Покупка: " + product.name;

    document.getElementById("playerId").value = "";

    document
      .getElementById("buyModal")
      .classList.add("show");

  }

  function closeBuyModal() {

    selectedProduct = null;

    document
      .getElementById("buyModal")
      .classList.remove("show");

  }

  async function confirmBuy() {

    if (!selectedProduct) {
      return;
    }

    const playerId =
      document.getElementById("playerId").value.trim();

    if (!playerId) {

      showToast("Введите игровой ID");

      return;
    }

    const initData = getInitData();

    if (!initData) {

      showToast(
        "Откройте Mini App через Telegram"
      );

      return;
    }

    try {

      const response = await fetchWithTimeout(
        API + "/api/buy",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            initData: initData,
            productId: selectedProduct.id,
            playerId: playerId
          })
        },
        10000
      );

      const data = await response.json();

      if (!response.ok || !data.ok) {

        throw new Error(
          data.error || "Покупка не выполнена"
        );

      }

      closeBuyModal();

      showToast("Покупка успешно оформлена");

      loadProfile();

    } catch (err) {

      showToast(
        err.message || "Ошибка покупки"
      );

    }

  }

  /*
   * ----------------------------------------------------
   * ПРОФИЛЬ
   * ----------------------------------------------------
   */

  async function loadProfile() {

    const error = document.getElementById("profileError");

    error.style.display = "none";

    const initData = getInitData();

    if (!initData) {

      document.getElementById("profileName").textContent =
        "Откройте через Telegram";

      return;
    }

    try {

      const response = await fetchWithTimeout(
        API + "/api/profile",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            initData: initData
          })
        },
        8000
      );

      const data = await response.json();

      if (!response.ok || !data.ok) {

        throw new Error(
          data.error || "Ошибка профиля"
        );

      }

      const user = data.user || {};

      document.getElementById("profileName").textContent =
        user.firstName ||
        user.name ||
        "—";

      document.getElementById("profileUsername").textContent =
        user.username
          ? "@" + user.username
          : "—";

      document.getElementById("profileId").textContent =user.telegramId ||
        user.id ||
        "—";

      const balance =
        Number(user.balance || 0);

      document.getElementById("profileBalance").textContent =
        balance + " POINT";

      document.getElementById("shopBalance").textContent =
        balance;

    } catch (err) {

      console.error("PROFILE ERROR:", err);

      error.textContent =
        err.message || "Ошибка загрузки профиля";

      error.style.display = "block";

    }

  }

  /*
   * ----------------------------------------------------
   * ИСТОРИЯ
   * ----------------------------------------------------
   */

  async function loadHistory() {

    const container =
      document.getElementById("history");

    const error =
      document.getElementById("historyError");

    error.style.display = "none";

    const initData = getInitData();

    if (!initData) {

      container.innerHTML = `
        <div class="empty">
          Откройте Mini App через Telegram,
          чтобы увидеть историю.
        </div>
      `;

      return;
    }

    container.innerHTML =
      '<div class="loading">Загрузка истории...</div>';

    try {

      const response = await fetchWithTimeout(
        API + "/api/history",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            initData: initData
          })
        },
        8000
      );

      const data = await response.json();

      if (!response.ok || !data.ok) {

        throw new Error(
          data.error || "Ошибка истории"
        );

      }

      const list =
        Array.isArray(data.transactions)
          ? data.transactions
          : Array.isArray(data.history)
            ? data.history
            : [];

      renderHistory(list);

    } catch (err) {

      console.error("HISTORY ERROR:", err);

      container.innerHTML = `
        <div class="empty">
          Не удалось загрузить историю.
        </div>
      `;

      error.textContent =
        err.message || "Ошибка загрузки истории";

      error.style.display = "block";

    }

  }

  function renderHistory(list) {

    const container =
      document.getElementById("history");

    if (!list.length) {

      container.innerHTML = `
        <div class="empty">
          История операций пока пуста.
        </div>
      `;

      return;
    }

    container.innerHTML = "";

    list.forEach(function(item) {

      const element =
        document.createElement("div");

      element.className =
        "history-item";

      const name =
        item.productName ||
        item.name ||
        item.description ||
        "Операция";

      const amount =
        item.amount !== undefined
          ? item.amount
          : item.price !== undefined
            ? item.price
            : 0;

      const date =
        item.createdAt ||
        item.date ||
        "";

      element.innerHTML = `
        <div class="history-name">
          ${escapeHtml(String(name))}
        </div>

        <div class="history-info">
          Сумма: ${escapeHtml(String(amount))} POINT
          ${date
            ? "
Дата: " + escapeHtml(String(date))
            : ""}
        </div>
      `;

      container.appendChild(element);

    });

  }

  /*
   * ----------------------------------------------------
   * БАЛАНС
   * ----------------------------------------------------
   */

  async function updateBalance() {

    const initData = getInitData();

    if (!initData) {
      return;
    }

    try {

      const response = await fetchWithTimeout(
        API + "/api/profile",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            initData: initData
          })
        },
        8000
      );

      const data = await response.json();

      if (!data.ok) {
        return;
