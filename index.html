<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>СК МЕТРОШОП</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background: #0d0d12;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        body {
            padding-bottom: 30px;
        }

        button {
            font-family: inherit;
        }

        .app {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
            padding: 14px;
        }

        /* HEADER */

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .logo {
            font-size: 21px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .balance {
            background: #181820;
            border: 1px solid #292936;
            padding: 9px 13px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
        }

        /* HERO */

        .hero {
            background: linear-gradient(
                135deg,
                #1d1730,
                #17131f
            );

            border: 1px solid #33264a;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .hero-title {
            font-size: 25px;
            font-weight: 900;
            margin-bottom: 7px;
        }

        .hero-text {
            color: #a8a8b4;
            font-size: 14px;
            line-height: 1.45;
        }

        /* MENU */

        .menu {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .menu-btn {
            border: none;
            border-radius: 13px;
            padding: 12px 8px;
            background: #17171f;
            color: #aaaab6;
            font-weight: 700;
            cursor: pointer;
        }

        .menu-btn.active {
            background: #7b43ff;
            color: #ffffff;
        }

        /* SECTION */

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .section-title {
            font-size: 20px;
            font-weight: 900;
            margin-bottom: 12px;
        }

        /* PRODUCTS */

        #products {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .product-card {
            background: #15151c;
            border: 1px solid #282832;
            border-radius: 17px;
            padding: 17px;
        }

        .product-title {
            font-size: 17px;
            line-height: 1.3;
            font-weight: 800;
            margin-bottom: 9px;
        }

        .product-price {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 13px;
        }

        .buy-button {
            width: 100%;
            border: none;
            border-radius: 12px;
            background: #7b43ff;
            color: white;
            padding: 13px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
        }

        .buy-button:active {
            transform: scale(.98);
        }

        /* PROFILE */

        .profile-card {
            background: #15151c;
            border: 1px solid #282832;
            border-radius: 17px;
            padding: 18px;
        }

        .profile-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 12px 0;
            border-bottom: 1px solid #272731;
        }

        .profile-row:last-child {
            border-bottom: none;
        }

        .profile-label {
            color: #9696a4;
        }

        .profile-value {
            font-weight: 800;
            text-align: right;
            word-break: break-word;
        }

        .topup-button {
            width: 100%;
            border: none;
            border-radius: 13px;
            background: #7b43ff;
            color: white;
            padding: 14px;
            margin-top: 15px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
        }

        /* HISTORY */

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .history-item {
            background: #15151c;
            border: 1px solid #282832;
            border-radius: 14px;
            padding: 14px;
        }

        .history-top {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 7px;
        }

        .history-description {
            font-weight: 700;
            line-height: 1.3;
        }

        .history-amount {
            font-weight: 900;
            white-space: nowrap;
        }

        .history-date {
            font-size: 12px;
            color: #777784;
        }

        .empty {
            background: #15151c;
            border: 1px solid #282832;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            color: #888894;
        }

        /* MODAL */

        .modal {
            position: fixed;
            inset: 0;
            display: none;
            align-items: flex-end;
            justify-content: center;
            background: rgba(0, 0, 0, .72);
            z-index: 1000;
            padding: 12px;
        }

        .modal.show {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 650px;
            background: #15151c;
            border: 1px solid #2d2d38;
            border-radius: 22px;
            padding: 20px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: 21px;
            font-weight: 900;
            margin-bottom: 15px;
        }

        .modal-product {
            color: #c0c0ca;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .input-label {
            display: block;
            color: #9999a6;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .input {
            width: 100%;
            border: 1px solid #30303a;
            outline: none;
            background: #0e0e14;
            color: white;
            padding: 13px;
            border-radius: 12px;
            font-size: 15px;
            margin-bottom: 15px;
        }

        .input:focus {
            border-color: #7b43ff;
        }

        /* QUANTITY */

        #quantityBox {
            display: none;
            margin-bottom: 15px;
        }

        .quantity-title {
            color: #9999a6;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 13px;
            background: #0e0e14;
            border: 1px solid #30303a;
            border-radius: 12px;
            padding: 7px;
        }

        .quantity-btn {
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 10px;
            background: #252530;
            color: white;
            font-size: 25px;
            font-weight: 900;
            cursor: pointer;
        }

        .quantity-value {
            min-width: 50px;
            text-align: center;
            font-size: 20px;
            font-weight: 900;
        }

        /* TOTAL */

        .total-box {
            background: #0e0e14;
            border: 1px solid #30303a;
            border-radius: 13px;
            padding: 14px;
            margin-bottom: 15px;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .total-label {
            color: #9999a6;
        }

        .total-price {
            font-size: 20px;
            font-weight: 900;
        }

        /* MODAL BUTTONS */

        .modal-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .modal-btn {
            border: none;
            border-radius: 12px;
            padding: 13px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
        }

        .modal-cancel {
            background: #282832;
            color: white;
        }

        .modal-confirm {
            background: #7b43ff;
            color: white;
        }

        /* TOP UP */

        .topup-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 9px;
            margin-bottom: 15px;
        }

        .topup-option {
            border: 1px solid #30303a;
            background: #0e0e14;
            color: white;
            padding: 15px;
            border-radius: 13px;
            font-weight: 800;
            cursor: pointer;
        }

        .topup-option.selected {
            border-color: #7b43ff;
            background: #22183b;
        }

        /* LOADING */

        .loading {
            text-align: center;
            padding: 30px 10px;
            color: #888894;
        }

        /* DESKTOP */

        @media (min-width: 600px) {
            #products {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            СК МЕТРОШОП
        </div>

        <div class="balance">
            <span id="balance">0</span> PT
        </div>

    </div>


    <!-- HERO -->

    <div class="hero">

        <div class="hero-title">
            Метрошоп
        </div>

        <div class="hero-text">
            Покупка товаров и услуг за POINT.
            Выберите нужный раздел ниже.
        </div>

    </div>


    <!-- MENU -->

    <div class="menu">

        <button
            class="menu-btn active"
            id="shopTab"
            onclick="showSection('shop')"
        >
            Магазин
        </button>

        <button
            class="menu-btn"
            id="profileTab"
            onclick="showSection('profile')"
        >
            Профиль
        </button>

        <button
            class="menu-btn"
            id="historyTab"
            onclick="showSection('history')"
        >
            История
        </button>

    </div>


    <!-- SHOP -->

    <div
        class="section active"
        id="shopSection"
    >

        <div class="section-title">
            Товары
        </div>

        <div id="products">
            <div class="loading">
                Загрузка товаров...
            </div>
        </div>

    </div>


    <!-- PROFILE -->

    <div
        class="section"
        id="profileSection"
    >

        <div class="section-title">
            Профиль
        </div>

        <div class="profile-card">

            <div class="profile-row">

                <div class="profile-label">
                    Имя
                </div>

                <div
                    class="profile-value"
                    id="profileName"
                >
                    —
                </div>

            </div>

            <div class="profile-row">

                <div class="profile-label">
                    Username
                </div>

                <div
                    class="profile-value"
                    id="profileUsername"
                >
                    —
                </div>

            </div>

            <div class="profile-row">

                <div class="profile-label">
                    Telegram ID
                </div>

                <div
                    class="profile-value"
                    id="profileId"
                >
                    —
                </div>

            </div>

            <div class="profile-row">

                <div class="profile-label">
                    Баланс
                </div>

                <div
                    class="profile-value"
                    id="profileBalance"
                >
                    0 PT
                </div>

            </div>

            <button
                class="topup-button"
                onclick="openTopup()"
            >
                Пополнить POINT
            </button>

        </div>

    </div>


    <!-- HISTORY -->

    <div
        class="section"
        id="historySection"
    >

        <div class="section-title">
            История
        </div>

        <div
            class="history-list"
            id="historyList"
        >
            <div class="loading">
                Загрузка истории...
            </div>
        </div>

    </div>

</div>


<!-- BUY MODAL -->

<div
    class="modal"
    id="buyModal"
>

    <div class="modal-box">

        <div class="modal-title">
            Покупка
        </div>

        <div
            class="modal-product"
            id="buyProduct"
        >
            —
        </div>


        <div id="quantityBox">

            <div class="quantity-title">
                Количество
            </div>

            <div class="quantity-controls">

                <button
                    class="quantity-btn"
                    onclick="changeQuantity(-1)"
                >
                    −
                </button>

                <div
                    class="quantity-value"
                    id="buyQuantity"
                >
                    1
                </div>

                <button
                    class="quantity-btn"
                    onclick="changeQuantity(1)"
                >
                    +
                </button>

            </div>

        </div>


        <label class="input-label">
            Игровой ID
        </label>

        <input
            class="input"
            id="gameId"
            type="text"
            placeholder="Введите игровой ID"
        >


        <div class="total-box">

            <div class="total-row">

                <div class="total-label">
                    Цена
                </div>

                <div
                    class="total-price"
                    id="buyTotalPrice"
                >
                    0 PT
                </div>

            </div>

        </div>


        <div class="modal-buttons">

            <button
                class="modal-btn modal-cancel"
                onclick="closeBuy()"
            >
                Отмена
            </button>

            <button
                class="modal-btn modal-confirm"
                onclick="confirmBuy()"
            >
                Купить
            </button>

        </div>

    </div>

</div>


<!-- TOPUP MODAL -->

<div
    class="modal"
    id="topupModal"
>

    <div class="modal-box">

        <div class="modal-title">
            Пополнение POINT
        </div>

        <div class="modal-product">
            Выберите сумму пополнения.
        </div>


        <div class="topup-options">

            <button
                class="topup-option"
                onclick="selectTopup(100, this)"
            >
                100 PT
            </button>

            <button
                class="topup-option"
                onclick="selectTopup(500, this)"
            >
                500 PT
            </button>

            <button
                class="topup-option"
                onclick="selectTopup(1000, this)"
            >
                1000 PT
            </button>

            <button
                class="topup-option"
                onclick="selectTopup(2500, this)"
            >
                2500 PT
            </button>

        </div>


        <div class="modal-buttons">

            <button
                class="modal-btn modal-cancel"
                onclick="closeTopup()"
            >
                Отмена
            </button>

            <button
                class="modal-btn modal-confirm"
                onclick="confirmTopup()"
            >
                Пополнить
            </button>

        </div>

    </div>

</div>


<script>

    /*
    ==========================================
                    CONFIG
    ==========================================
    */

    const tg =
        window.Telegram &&
        window.Telegram.WebApp
            ? window.Telegram.WebApp
            : null;

    const API =
        "https://telegram-appp.onrender.com";


    if (tg) {
        tg.ready();
        tg.expand();
    }


    let selectedProduct = null;

    let selectedPrice = 0;

    let selectedQuantity = 1;

    let quantityEnabled = false;

    let maxQuantity = 10;

    let selectedTopupAmount = null;


    /*
    ==========================================
              TELEGRAM INIT DATA
    ==========================================
    */

    function getInitData() {

        if (tg && tg.initData) {
            return tg.initData;
        }

        return "";
    }


    /*
    ==========================================
                    API
    ==========================================
    */

    async function api(
        endpoint,
        body = {}
    ) {

        const response =
            await fetch(
                API + endpoint,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            ...body,
                            initData:
                                getInitData()
                        })
                }
            );

        let data;

        try {
            data =
                await response.json();
        } catch (error) {

            throw new Error(
                "Сервер вернул неправильный ответ"
            );
        }

        if (!response.ok) {

            throw new Error(
                data.error ||
                `Ошибка HTTP ${response.status}`
            );
        }

        return data;
    }


    /*
    ==========================================
                 SECTION SWITCH
    ==========================================
    */

    function showSection(section) {

        document
            .querySelectorAll(".section")
            .forEach(
                el =>
                    el.classList.remove(
                        "active"
                    )
            );


        document
            .querySelectorAll(".menu-btn")
            .forEach(
                el =>
                    el.classList.remove(
                        "active"
                    )
            );


        if (section === "shop") {

            document
                .getElementById(
                    "shopSection"
                )
                .classList.add("active");

            document
                .getElementById(
                    "shopTab"
                )
                .classList.add("active");

            loadProducts();

        }


        if (section === "profile") {

            document
                .getElementById(
                    "profileSection"
                )
                .classList.add("active");

            document
                .getElementById(
                    "profileTab"
                )
                .classList.add("active");

            loadProfile();

        }


        if (section === "history") {

            document
                .getElementById(
                    "historySection"
                )
                .classList.add("active");

            document
                .getElementById(
                    "historyTab"
                )
                .classList.add("active");

            loadHistory();

        }

    }


    /*
    ==========================================
              LOAD PRODUCTS
    ==========================================
    */

    async function loadProducts() {

        const container =
            document.getElementById(
                "products"
            );

        container.innerHTML = `
            <div class="loading">
                Загрузка товаров...
            </div>
        `;


        try {

            const response =
                await fetch(
                    `${API}/api/products`
                );


            if (!response.ok) {

                throw new Error(
                    `HTTP ${response.status}`
                );

            }


            const data =
                await response.json();


            console.log(
                "Ответ /api/products:",
                data
            );


            /*
             * ТВОЙ SERVER.JS ОТДАЁТ:
             *
             * {
             *   ok: true,
             *   products: [...]
             * }
             *
             * Поэтому достаём именно data.products.
             */

            let products = [];


            if (
                Array.isArray(data)
            ) {

                products =
                    data;

            } else if (
                Array.isArray(
                    data.products
                )
            ) {

                products =
                    data.products;

            }


            if (
                products.length === 0
            ) {

                container.innerHTML = `
                    <div class="empty">
                        Товаров пока нет
                    </div>
                `;

                return;
            }


            container.innerHTML = "";


            products.forEach(
                product => {

                    const name =
                        String(
                            product.name || ""
                        );


                    const price =
                        Number(
                            product.price
                        ) || 0;


                    /*
                     * Количество разрешено
                     * только для двух товаров.
                     */

                    const lowerName =
                        name
                            .trim()
                            .toLowerCase();


                    const isQuantityProduct =
                        (
                            lowerName ===
                            "набор фулл 6"
                        ) ||
                        (
                            lowerName ===
                            "набор фулл 6 + мк вк на обвесах"
                        );


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "product-card";


                    let priceText =
                        price > 0
                            ? `${price} PT`
                            : "Цена уточняется";


                    card.innerHTML = `

                        <div class="product-title">
                            ${escapeHtml(name)}
                        </div>

                        <div class="product-price">
                            ${priceText}
                        </div>

                        ${
                            isQuantityProduct
                                ? `
                                    <div style="
                                        color:#777784;
                                        font-size:12px;
                                        margin-bottom:12px;
                                    ">
                                        Количество: 1–10 шт.
                                    </div>
                                `
                                : ""
                        }

                        <button
                            class="buy-button"
                        >
                            Купить
                        </button>

                    `;


                    const buyButton =
                        card.querySelector(
                            ".buy-button"
                        );


                    buyButton.addEventListener(
                        "click",
                        () => {

                            openBuy(
                                product
                            );

                        }
                    );


                    container.appendChild(
                        card
                    );

                }
            );


        } catch (error) {

            console.error(
                "Ошибка товаров:",
                error
            );


            container.innerHTML = `

                <div class="empty">

                    Не удалось загрузить товары.<br>

                    <span style="
                        font-size:12px;
                        color:#666672;
                    ">
                        Проверь соединение с сервером.
                    </span>

                </div>

            `;

        }

    }


    /*
    ==========================================
              ESCAPE HTML
    ==========================================
    */

    function escapeHtml(text) {

        return String(text)
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }


    /*
    ==========================================
                  BUY MODAL
    ==========================================
    */

    function openBuy(product) {

        selectedProduct =
            product.name;


        selectedPrice =
            Number(product.price) || 0;


        selectedQuantity = 1;


        const name =
            String(
                product.name || ""
            )
            .trim()
            .toLowerCase();


        quantityEnabled =
            (
                product.quantityEnabled === true
            ) ||
            (
                name ===
                "набор фулл 6"
            ) ||
            (
                name ===
                "набор фулл 6 + мк вк на обвесах"
            );


        maxQuantity =
            Number(
                product.maxQuantity
            ) || 10;


        if (!quantityEnabled) {

            maxQuantity = 1;

        }


        document
            .getElementById(
                "buyProduct"
            )
            .textContent =
                product.name;


        document
            .getElementById(
                "buyQuantity"
            )
            .textContent =
                selectedQuantity;


        document
            .getElementById(
                "gameId"
            )
            .value = "";


        document
            .getElementById(
                "quantityBox"
            )
            .style.display =
                quantityEnabled
                    ? "block"
                    : "none";


        updateTotal();


        document
            .getElementById(
                "buyModal"
            )
            .classList.add(
                "show"
            );

    }


    function closeBuy() {

        document
            .getElementById(
                "buyModal"
            )
            .classList.remove(
                "show"
            );

    }


    /*
    ==========================================
                 QUANTITY
    ==========================================
    */

    function changeQuantity(change) {

        if (!quantityEnabled) {
            return;
        }


        selectedQuantity +=
            change;


        if (
            selectedQuantity < 1
        ) {

            selectedQuantity = 1;

        }


        if (
            selectedQuantity >
            maxQuantity
        ) {

            selectedQuantity =
                maxQuantity;

        }


        document
            .getElementById(
                "buyQuantity"
            )
            .textContent =
                selectedQuantity;


        updateTotal();

    }


    /*
    ==========================================
                 TOTAL PRICE
    ==========================================
    */

    function updateTotal() {

        const total =
            selectedPrice *
            selectedQuantity;


        document
            .getElementById(
                "buyTotalPrice"
            )
            .textContent =
                `${total} PT`;

    }


    /*
    ==========================================
                  CONFIRM BUY
    ==========================================
    */

    async function confirmBuy() {

        const gameId =
            document
                .getElementById(
                    "gameId"
                )
                .value
                .trim();


        if (!gameId) {

            alert(
                "Введите игровой ID"
            );

            return;

        }


        if (
            !selectedProduct
        ) {

            alert(
                "Товар не выбран"
            );

            return;

        }


        const button =
            document.querySelector(
                "#buyModal .modal-confirm"
            );


        const oldText =
            button.textContent;


        button.disabled = true;

        button.textContent =
            "Оформление...";


        try {

            const result =
                await api(
                    "/api/buy",
                    {
                        product:
                            selectedProduct,

                        gameId,

                        quantity:
                            selectedQuantity
                    }
                );


            document
                .getElementById(
                    "balance"
                )
                .textContent =
                    result.balance;


            document
                .getElementById(
                    "profileBalance"
                )
                .textContent =
                    `${result.balance} PT`;


            closeBuy();


            alert(
                `✅ Заказ #${result.orderId} создан!\n\n` +
                `Количество: ${result.quantity} шт.\n` +
                `Итого: ${result.totalPrice} PT`
            );


            loadProfile();


        } catch (error) {

            console.error(
                "Ошибка покупки:",
                error
            );


            alert(
                `❌ ${error.message}`
            );

        }


        button.disabled = false;

        button.textContent =
            oldText;

    }


    /*
    ==========================================
                  PROFILE
    ==========================================
    */

    async function loadProfile() {

        try {

            const result =
                await api(
                    "/api/profile"
                );


            const user =
                result.user;


            document
                .getElementById(
                    "balance"
                )
                .textContent =
                    user.balance;


            document
                .getElementById(
                    "profileName"
                )
                .textContent =
                    user.firstName ||
                    "—";


            document
                .getElementById(
                    "profileUsername"
                )
                .textContent =
                    user.username
                        ? `@${user.username}`
                        : "—";


            document
                .getElementById(
                    "profileId"
                )
                .textContent =
                    user.id ||
                    "—";


            document
                .getElementById(
                    "profileBalance"
                )
                .textContent =
                    `${user.balance} PT`;


        } catch (error) {

            console.error(
                "Ошибка профиля:",
                error
            );

        }

    }


    /*
    ==========================================
                   HISTORY
    ==========================================
    */

    async function loadHistory() {

        const container =
            document.getElementById(
                "historyList"
            );


        container.innerHTML = `
            <div class="loading">
                Загрузка истории...
            </div>
        `;


        try {

            const result =
                await api(
                    "/api/history"
                );


            const history =
                Array.isArray(
                    result.history
                )
                    ? result.history
                    : [];


            if (
                history.length === 0
            ) {

                container.innerHTML = `
                    <div class="empty">
                        История пока пустая
                    </div>
                `;

                return;

            }


            container.innerHTML = "";


            history.forEach(
                item => {

                    const element =
                        document.createElement(
                            "div"
                        );


                    element.className =
                        "history-item";


                    const amount =
                        Number(
                            item.amount
                        ) || 0;


                    const amountText =
                        amount >= 0
                            ? `+${amount} PT`
                            : `${amount} PT`;


                    const date =
                        item.date
                            ? new Date(
                                item.date
                            ).toLocaleString(
                                "ru-RU"
                            )
                            : "—";


                    element.innerHTML = `

                        <div class="history-top">

                            <div class="history-description">
                                ${escapeHtml(
                                    item.description ||
                                    "Операция"
                                )}
                            </div>

                            <div class="history-amount">
                                ${amountText}
                            </div>

                        </div>

                        <div class="history-date">
                            ${date}
                        </div>

                    `;


                    container.appendChild(
                        element
                    );

                }
            );


        } catch (error) {

            console.error(
                "Ошибка истории:",
                error
            );


            container.innerHTML = `
                <div class="empty">
                    Не удалось загрузить историю
                </div>
            `;

        }

    }


    /*
    ==========================================
                  TOP UP
    ==========================================
    */

    function openTopup() {

        selectedTopupAmount =
            null;


        document
            .querySelectorAll(
                ".topup-option"
            )
            .forEach(
                el =>
                    el.classList.remove(
                        "selected"
                    )
            );


        document
            .getElementById(
                "topupModal"
            )
            .classList.add(
                "show"
            );

    }


    function closeTopup() {

        document
            .getElementById(
                "topupModal"
            )
            .classList.remove(
                "show"
            );

    }


    function selectTopup(
        amount,
        button
    ) {

        selectedTopupAmount =
            amount;


        document
            .querySelectorAll(
                ".topup-option"
            )
            .forEach(
                el =>
                    el.classList.remove(
                        "selected"
                    )
            );


        button.classList.add(
            "selected"
        );

    }


    async function confirmTopup() {

        if (
            !selectedTopupAmount
        ) {

            alert(
                "Выберите сумму"
            );

            return;

        }


        try {

            const result =
                await api(
                    "/api/topup/create",
                    {
                        amount:
                            selectedTopupAmount
                    }
                );


            if (
                result.paymentUrl
            ) {

                window.open(
                    result.paymentUrl,
                    "_blank"
                );

            } else {

                alert(
                    result.message ||
                    "Пополнение пока не подключено."
                );

            }


        } catch (error) {

            console.error(
                "Ошибка пополнения:",
                error
            );


            alert(
                `❌ ${error.message}`
            );

        }

    }


    /*
    ==========================================
                 CLOSE MODALS
    ==========================================
    */

    document
        .getElementById(
            "buyModal"
        )
        .addEventListener(
            "click",
            function(event) {

                if (
                    event.target === this
                ) {

                    closeBuy();

                }

            }
        );


    document
        .getElementById(
            "topupModal"
        )
        .addEventListener(
            "click",
            function(event) {

                if (
                    event.target === this
                ) {

                    closeTopup();

                }

            }
        );


    /*
    ==========================================
                    START
    ==========================================
    */

    loadProducts();

    loadProfile();

</script>

</body>
</html>
