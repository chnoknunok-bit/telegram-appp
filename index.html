<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>СК МЕТРОШОП</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0d0d12;
      color: white;
      font-family: Arial, sans-serif;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .page {
      display: none;
      padding: 16px;
      padding-bottom: 90px;
    }

    .page.active {
      display: block;
    }

    h1 {
      margin-top: 5px;
      font-size: 24px;
    }

    .card {
      background: #18181f;
      border: 1px solid #292933;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .balance {
      font-size: 28px;
      font-weight: bold;
      margin-top: 8px;
    }

    .muted {
      color: #8c8c98;
      font-size: 14px;
    }

    .products {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .product {
      background: #18181f;
      border: 1px solid #292933;
      border-radius: 15px;
      padding: 15px;
    }

    .product-name {
      font-size: 16px;
      font-weight: bold;
    }

    .product-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 13px;
    }

    .price {
      color: #aaaab5;
      font-size: 14px;
    }

    .buy {
      background: white;
      color: black;
      padding: 10px 15px;
      border-radius: 10px;
      font-weight: bold;
    }

    .buy:disabled {
      opacity: .4;
    }

    .loading {
      text-align: center;
      padding: 30px 10px;
      color: #888894;
    }

    .error {
      background: #28171b;
      border: 1px solid #5b252e;
      padding: 15px;
      border-radius: 12px;
      color: #ff9da9;
    }

    .nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;

      display: flex;

      background: #15151b;
      border-top: 1px solid #292932;

      padding: 8px;
      padding-bottom: calc(
        8px + env(safe-area-inset-bottom)
      );

      z-index: 100;
    }

    .nav button {
      flex: 1;
      background: transparent;
      color: #777783;
      padding: 9px 5px;
      font-size: 12px;
    }

    .nav button.active {
      color: white;
    }

    .nav-icon {
      display: block;
      font-size: 19px;
      margin-bottom: 3px;
    }

    .modal {
      display: none;

      position: fixed;
      inset: 0;

      background: rgba(0,0,0,.75);

      align-items: flex-end;

      z-index: 200;
    }

    .modal.active {
      display: flex;
    }

    .modal-box {
      width: 100%;
      background: #18181f;
      padding: 20px;
      border-radius: 20px 20px 0 0;
    }

    input {
      width: 100%;
      padding: 13px;

      margin-top: 12px;

      background: #0e0e13;
      border: 1px solid #30303a;

      color: white;

      border-radius: 10px;

      outline: none;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .modal-buttons button {
      flex: 1;
      padding: 13px;
      border-radius: 10px;
      font-weight: bold;
    }

    .cancel {
      background: #292930;
      color: white;
    }

    .confirm {
      background: white;
      color: black;
    }

    .history-item {
      background: #18181f;
      border: 1px solid #292933;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
    }

    .positive {
      color: #71d68a;
      font-weight: bold;
    }

    .negative {
      color: #ff7d89;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <!-- ================================= -->
  <!-- МАГАЗИН -->
  <!-- ================================= -->

  <div
    id="shop"
    class="page active"
  >

    <h1>
      🛒 СК МЕТРОШОП
    </h1>

    <div class="card"><div class="muted">
        Баланс
      </div>

      <div class="balance">
        <span id="shopBalance">
          0
        </span>
        POINT
      </div>

    </div>

    <h2>
      Товары
    </h2>

    <div
      id="products"
      class="products"
    >
      <div class="loading">
        Загрузка товаров...
      </div>
    </div>

  </div>

  <!-- ================================= -->
  <!-- ИСТОРИЯ -->
  <!-- ================================= -->

  <div
    id="history"
    class="page"
  >

    <h1>
      📋 История
    </h1>

    <div
      id="historyContent"
    >
      <div class="loading">
        Загрузка истории...
      </div>
    </div>

  </div>

  <!-- ================================= -->
  <!-- ПРОФИЛЬ -->
  <!-- ================================= -->

  <div
    id="profile"
    class="page"
  >

    <h1>
      👤 Профиль
    </h1>

    <div
      id="profileContent"
    >
      <div class="loading">
        Загрузка профиля...
      </div>
    </div>

  </div>

  <!-- ================================= -->
  <!-- НИЖНЕЕ МЕНЮ -->
  <!-- ================================= -->

  <div class="nav">

    <button
      id="shopButton"
      class="active"
      onclick="openPage('shop')"
    >
      <span class="nav-icon">
        🛒
      </span>

      Магазин
    </button>

    <button
      id="historyButton"
      onclick="openPage('history')"
    >
      <span class="nav-icon">
        📋
      </span>

      История
    </button>

    <button
      id="profileButton"
      onclick="openPage('profile')"
    >
      <span class="nav-icon">
        👤
      </span>

      Профиль
    </button>

  </div>

  <!-- ================================= -->
  <!-- ПОКУПКА -->
  <!-- ================================= -->

  <div
    id="buyModal"
    class="modal"
  >

    <div class="modal-box">

      <h2>
        Покупка
      </h2>

      <div
        id="selectedProduct"
        class="muted"
      ></div>

      <input
        id="playerId"
        placeholder="Введите игровой ID"
      >

      <div class="modal-buttons">

        <button
          class="cancel"
          onclick="closeBuy()"
        >
          Отмена
        </button>

        <button
          class="confirm"
          onclick="buyProduct()"
        >
          Купить
        </button>

      </div>

    </div>

  </div>

<script>

  // =========================================
  // НАСТРОЙКИ
  // =========================================

  const API =
    "https://telegram-appp.onrender.com";

  let tg =
    window.Telegram?.WebApp || null;

  let initData = "";

  let products = [];

  let selectedProduct = null;

  let userBalance = 0;

  // =========================================
  // TELEGRAM
  // =========================================

  function initTelegram() {

    if (!tg) {
      console.log(
        "Telegram WebApp не найден"
      );

      return;
    }

    try {

      tg.ready();

      tg.expand();

      initData =
        tg.initData || "";

    } catch (e) {

      console.error(e);

    }

  }

  // =========================================
  // API
  // =========================================

  async function request(
    url,
    options = {}
  ) {

    const controller =
      new AbortController();

    const timeout =
      setTimeout(
        () => controller.abort(),
        8000
      );

    try {

      const response =
        await fetch(
          API + url,
          {
            ...options,

            signal:
              controller.signal,

            headers: {
              "Content-Type":
                "application/json",

              ...(options.headers || {})
            }
          }
        );

      const text =
        await response.text();

      let data = {};

      try {

        data =
          text
            ? JSON.parse(text)
            : {};

      } catch (_) {

        throw new Error(
          "Сервер вернул неправильный ответ"
        );

      }if (!response.ok) {

        throw new Error(
          data.error ||
          "Ошибка сервера"
        );

      }

      return data;

    } finally {

      clearTimeout(timeout);

    }

  }

  function postData(
    extra = {}
  ) {

    return JSON.stringify({
      initData,
      ...extra
    });

  }

  // =========================================
  // ПЕРЕКЛЮЧЕНИЕ СТРАНИЦ
  // =========================================

  function openPage(
    page
  ) {

    document
      .querySelectorAll(".page")
      .forEach(
        element => {
          element.classList.remove(
            "active"
          );
        }
      );

    document
      .getElementById(page)
      .classList.add(
        "active"
      );

    document
      .querySelectorAll(".nav button")
      .forEach(
        button => {
          button.classList.remove(
            "active"
          );
        }
      );

    const button =
      document.getElementById(
        page + "Button"
      );

    if (button) {

      button.classList.add(
        "active"
      );

    }

    // Загружаем данные отдельно.
    // Они НЕ блокируют переключение.

    if (page === "history") {

      loadHistory();

    }

    if (page === "profile") {

      loadProfile();

    }

    if (page === "shop") {

      if (!products.length) {

        loadProducts();

      }

    }

  }

  // =========================================
  // БАЛАНС
  // =========================================

  function setBalance(
    value
  ) {

    userBalance =
      Number(value || 0);

    document.getElementById(
      "shopBalance"
    ).textContent =
      userBalance.toLocaleString(
        "ru-RU"
      );

  }

  // =========================================
  // ТОВАРЫ
  // =========================================

  async function loadProducts() {

    const container =
      document.getElementById(
        "products"
      );

    container.innerHTML =
      `<div class="loading">
        Загрузка товаров...
      </div>`;

    try {

      const data =
        await request(
          "/api/products"
        );

      if (!data.ok) {

        throw new Error(
          data.error ||
          "Не удалось загрузить товары"
        );

      }

      products =
        Array.isArray(
          data.products
        )
          ? data.products
          : [];

      renderProducts();

    } catch (error) {

      console.error(
        "Products:",
        error
      );

      container.innerHTML = `

        <div class="error">

          Не удалось загрузить товары.

          

          ${escapeHtml(
            error.message
          )}

          

          <button
            class="buy"
            onclick="loadProducts()"
          >
            Повторить
          </button>

        </div>

      `;

    }

  }

  function renderProducts() {

    const container =
      document.getElementById(
        "products"
      );

    if (!products.length) {

      container.innerHTML =
        `<div class="loading">
          Товаров пока нет.
        </div>`;

      return;

    }

    container.innerHTML =
      products
        .map(
          product => {

            const price =
              Number(
                product.price || 0
              );

            return `

              <div class="product">

                <div class="product-name">

                  ${escapeHtml(
                    product.name
                  )}

                </div>

                <div class="product-bottom">

                  <div class="price">

                    ${
                      price > 0
                        ? price.toLocaleString(
                            "ru-RU"
                          ) +
                          " POINT"
                        : "Цена уточняется"
                    }

                  </div>

                  <button
                    class="buy"
                    ${
                      price <=0
                        ? "disabled"
                        : ""
                    }

                    onclick="openBuy('${escapeAttr(
                      product.id
                    )}')"
                  >

                    ${
                      price > 0
                        ? "Купить"
                        : "Скоро"
                    }

                  </button>

                </div>

              </div>

            `;

          }
        )
        .join("");

  }

  // =========================================
  // ПРОФИЛЬ
  // =========================================

  async function loadProfile() {

    const container =
      document.getElementById(
        "profileContent"
      );

    container.innerHTML =
      `<div class="loading">
        Загрузка профиля...
      </div>`;

    if (!initData) {

      container.innerHTML =
        `<div class="error">
          Mini App не получил данные Telegram.
        </div>`;

      return;

    }

    try {

      const data =
        await request(
          "/api/profile",
          {
            method: "POST",

            body:
              postData()
          }
        );

      if (!data.ok) {

        throw new Error(
          data.error ||
          "Ошибка профиля"
        );

      }

      const profile =
        data.profile;

      setBalance(
        profile.balance
      );

      const name =
        [
          profile.firstName,
          profile.lastName
        ]
          .filter(Boolean)
          .join(" ") ||
        "Пользователь";

      const username =
        profile.username
          ? "@" +
            profile.username
          : "Не указан";

      container.innerHTML = `

        <div class="card">

          <h2>
            ${escapeHtml(name)}
          </h2>

          <p class="muted">
            ${escapeHtml(username)}
          </p>

          <hr>

          <p>
            <span class="muted">
              Telegram ID
            </span>

            

            ${escapeHtml(
              String(profile.id)
            )}
          </p>

          <p>
            <span class="muted">
              Баланс
            </span>

            

            <b>
              ${Number(
                profile.balance || 0
              ).toLocaleString("ru-RU")}
              POINT
            </b>
          </p>

        </div>

      `;

    } catch (error) {

      console.error(
        "Profile:",
        error
      );

      container.innerHTML = `

        <div class="error">

          Не удалось загрузить профиль.

          

          ${escapeHtml(
            error.message
          )}

          

          <button
            class="buy"
            onclick="loadProfile()"
          >
            Повторить
          </button>

        </div>

      `;

    }

  }

  // =========================================
  // ИСТОРИЯ
  // =========================================

  async function loadHistory() {

    const container =
      document.getElementById(
        "historyContent"
      );

    container.innerHTML =
      `<div class="loading">
        Загрузка истории...
      </div>`;

    if (!initData) {

      container.innerHTML =
        `<div class="error">
          Mini App не получил данные Telegram.
        </div>`;

      return;

    }

    try {

      const data =
        await request(
          "/api/history",
          {
            method: "POST",

            body:
              postData()
          }
        );

      if (!data.ok) {

        throw new Error(
          data.error ||
          "Ошибка истории"
        );

      }

      const history =
        Array.isArray(
          data.history
        )
          ? data.history
          : [];

      if (!history.length) {

        container.innerHTML =
          `<div class="loading">
            История операций пуста.
          </div>`;

        return;

      }

      container.innerHTML =
        history
          .map(
            item => {

              const amount =
                Number(
                  item.amount || 0
                );

              const positive =
                amount > 0;

              const date =
                item.createdAt
                  ? new Date(
                      item.createdAt
                    ).toLocaleString(
                      "ru-RU"
                    )
                  : "";

              return `

                <div class="history-item">

                  <b>

                    ${escapeHtml(
                      item.description ||
                      "Операция"
                    )}

                  </b>

                  <div class="muted">

                    ${escapeHtml(
                      date
                    )}

                  </div>

                  

                  <span
                    class="${
                      positive
                        ? "positive"
                        : "negative"
                    }"
                  >

                    ${
                      positive
                        ? "+"
                        : ""
                    }

                    ${amount.toLocaleString(
                      "ru-RU"
                    )}

                    POINT

                  </span>

                </div>

              `;

            }
          )
          .join("");

    } catch (error) {

      console.error(
        "History:",
        error
      );

      container.innerHTML = `

        <div class="error">

          Не удалось загрузить историю.

          

          ${escapeHtml(
            error.message
          )}

          

          <button
            class="buy"
            onclick="loadHistory()"
          >
            Повторить
          </button>

        </div>

      `;

    }

  }

  // =========================================
  // ПОКУПКА
  // =========================================

  function openBuy(
    productId
  ) {

    selectedProduct =
      products.find(
        product =>
          product.id ===
          productId
      );

    if (!selectedProduct) {

      return;

    }

    document.getElementById(
      "selectedProduct"
    ).textContent =
      selectedProduct.name;

    document.getElementById(
      "playerId"
    ).value = "";

    document.getElementById(
      "buyModal"
    ).classList.add(
      "active"
    );

  }

  function closeBuy() {

    document.getElementById(
      "buyModal"
    ).classList.remove(
      "active"
    );

    selectedProduct =
      null;

  }

  async function buyProduct() {

    if (!selectedProduct) {

      return;

    }

    const playerId =
      document.getElementById(
        "playerId"
      ).value.trim();

    if (!playerId) {

      alert(
        "Введите игровой ID"
      );

      return;

    }

    try {

      const data =
        await request(
          "/api/buy",
          {
            method: "POST",

            body:
              postData({
                productId:
                  selectedProduct.id,

                playerId
              })
          }
        );

      if (!data.ok) {

        throw new Error(
          data.error ||
          "Не удалось купить товар"
        );

      }

      closeBuy();

      alert(
        `Заказ #${
          data.order?.id || ""
        } создан`
      );

      loadProfile();

      loadHistory();

    } catch (error) {

      alert(
        error.message
      );

    }

  }

  // =========================================
  // БЕЗОПАСНЫЙ HTML
  // =========================================

  function escapeHtml(
    value
  ) {

    return String(
      value ?? ""
    )
      .replaceAll(
        "&",
        "&amp;"
      )
      .replaceAll(
        "<",
        "&lt;"
