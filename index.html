<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >
    <title>СК МЕТРОШОП</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #071426;
            color: white;
            min-height: 100vh;
        }

        button {
            font-family: inherit;
        }

        .header {
            background: #0b1d35;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #19375d;
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #6ea8ff;
        }

        .balance {
            background: #102b4d;
            padding: 8px 12px;
            border-radius: 12px;
            color: #7db2ff;
            font-weight: bold;
        }

        .hero {
            padding: 25px 18px;
            text-align: center;
            background: linear-gradient(180deg, #0b1d35, #071426);
        }

        .hero h1 {
            font-size: 27px;
            margin-bottom: 10px;
        }

        .hero p {
            color: #91a8c5;
            font-size: 14px;
        }

        .menu {
            display: flex;
            gap: 8px;
            padding: 10px;
            background: #09192d;
            position: sticky;
            top: 62px;
            z-index: 15;
        }

        .menu button {
            flex: 1;
            background: #102b4d;
            color: #a9c8ef;
            border: 1px solid #19375d;
            border-radius: 10px;
            padding: 11px 5px;
            cursor: pointer;
        }

        .menu button.active {
            background: #2466b1;
            color: white;
        }

        .section {
            display: none;
            padding: 15px;
        }

        .section.active {
            display: block;
        }

        .section-title {
            font-size: 22px;
            margin-bottom: 15px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
        }

        .product {
            background: #0c2039;
            border: 1px solid #19375d;
            border-radius: 15px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            min-height: 190px;
        }

        .product-icon {
            font-size: 35px;
            margin-bottom: 10px;
        }

        .product-name {
            font-size: 16px;
            font-weight: bold;
            line-height: 1.25;
            margin-bottom: 8px;
        }

        .product-price {
            color: #75adff;
            font-weight: bold;
            margin-bottom: 12px;
            margin-top: auto;
        }

        .order {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 11px;
            background: #2466b1;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .order:active {
            transform: scale(0.98);
        }

        .profile-card {
            background: #0c2039;
            border: 1px solid #19375d;
            border-radius: 15px;
            padding: 20px;
        }

        .profile-name {
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .profile-balance {
            font-size: 18px;
            color: #75adff;
            margin-bottom: 18px;
        }

        .topup-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #2466b1;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .history-item {
            background: #0c2039;
            border: 1px solid #19375d;
            border-radius: 13px;
            padding: 15px;
            margin-bottom: 10px;
        }

        .history-product {
            font-weight: bold;
            margin-bottom: 6px;
        }

        .history-info {
            color: #91a8c5;
            font-size: 13px;
            line-height: 1.6;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.72);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .modal.show {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 420px;
            background: #0c2039;
            border: 1px solid #24466f;
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.45);
        }

        .modal-box h2 {
            margin-bottom: 15px;
        }

        .modal-box p {
            margin-bottom: 12px;
        }

        .input {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            border: 1px solid #294d76;
            background: #071426;
            color: white;
            outline: none;
            margin-top: 7px;
            margin-bottom: 15px;
        }

        .input:focus {
            border-color: #4285d4;
        }

        .quantity-box {
            background: #091a2e;
            border: 1px solid #19375d;
            border-radius: 12px;
            padding: 12px;
            margin: 10px 0 14px;
        }

        .quantity-title {
            font-size: 14px;
            color: #91a8c5;
            margin-bottom: 10px;
            text-align: center;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
        }

        .quantity-controls button {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 10px;
            background: #2466b1;
            color: white;
            font-size: 25px;
            font-weight: bold;
            cursor: pointer;
        }

        .quantity-controls button:disabled {
            background: #1a2d43;
            color: #536b85;
            cursor: default;
        }

        #buyQuantity {
            min-width: 30px;
            text-align: center;
            font-size: 22px;
        }

        .total-price {
            font-size: 18px;
            color: #75adff;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .cancel {
            background: #25384e;
            color: white;
        }

        .confirm {
            background: #2466b1;
            color: white;
        }

        .topup-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .topup-option {
            background: #102b4d;
            color: white;
            border: 1px solid #24466f;
            border-radius: 10px;
            padding: 14px;
            cursor: pointer;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            color: #7189a5;
            padding: 30px 10px;
        }

        .loading {
            text-align: center;
            color: #7189a5;
            padding: 30px;
        }

        @media (max-width: 400px) {
            .grid {
                grid-template-columns: 1fr 1fr;
            }

            .product {
                padding: 12px;
            }

            .product-name {
                font-size: 14px;
            }

            .hero h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <div class="logo">СК МЕТРОШОП</div>
        <div class="balance">
            <span id="headerBalance">0</span> PT
        </div>
    </header>

    <!-- HERO -->
    <div class="hero">
        <h1>СК МЕТРОШОП</h1>
        <p>Магазин товаров для Metro Royale</p>
    </div>

    <!-- MENU -->
    <div class="menu">
        <button id="shopBtn" class="active" onclick="showSection('shop')">
            🛒 Магазин
        </button>

        <button id="profileBtn" onclick="showSection('profile')">
            👤 Профиль
        </button>

        <button id="historyBtn" onclick="showSection('history')">
            📜 История
        </button>
    </div>

    <!-- SHOP -->
    <section id="shop" class="section active">
        <h2 class="section-title">🛒 Магазин</h2>

        <div id="products" class="grid">
            <div class="loading">Загрузка товаров...</div>
        </div>
    </section>

    <!-- PROFILE -->
    <section id="profile" class="section">
        <h2 class="section-title">👤 Профиль</h2>

        <div class="profile-card">
            <div class="profile-name" id="profileName">
                Загрузка...
            </div>

            <div class="profile-balance">
                Баланс:
                <b><span id="profileBalance">0</span> PT</b>
            </div>

            <button class="topup-button" onclick="openTopup()">
                💳 Пополнить баланс
            </button>
        </div>
    </section>

    <!-- HISTORY -->
    <section id="history" class="section">
        <h2 class="section-title">📜 История заказов</h2>

        <div id="historyList">
            <div class="loading">Загрузка...</div>
        </div>
    </section>


    <!-- BUY MODAL -->
    <div id="buyModal" class="modal">
        <div class="modal-box">

            <h2>🛒 Оформление заказа</h2>

            <p id="buyProduct"></p>

            <p>
                Цена за 1 шт.:
                <b id="buyPrice">0 PT</b>
            </p>

            <!-- QUANTITY -->
            <div id="quantityBox" class="quantity-box" style="display: none;">

                <div class="quantity-title">
                    Количество
                </div>

                <div class="quantity-controls">

                    <button
                        type="button"
                        id="minusQuantity"
                        onclick="changeQuantity(-1)"
                    >
                        −
                    </button>

                    <b id="buyQuantity">1</b>

                    <button
                        type="button"
                        id="plusQuantity"
                        onclick="changeQuantity(1)"
                    >
                        +
                    </button>

                </div>

            </div>

            <p class="total-price">
                Итого:
                <b id="buyTotalPrice">0 PT</b>
            </p>

            <label>
                🎮 Игровой ID
            </label>

            <input
                id="gameId"
                class="input"
                type="text"
                placeholder="Введите Game ID"
                autocomplete="off"
            >

            <div class="modal-buttons">

                <button
                    class="cancel"
                    type="button"
                    onclick="closeBuy()"
                >
                    Отмена
                </button>

                <button
                    class="confirm"
                    type="button"
                    onclick="confirmBuy()"
                >
                    Купить
                </button>

            </div>

        </div>
    </div>


    <!-- TOPUP MODAL -->
    <div id="topupModal" class="modal">

        <div class="modal-box">

            <h2>💳 Пополнение</h2>

            <p>
                Выберите количество PT:
            </p>

            <div class="topup-options">

                <button
                    class="topup-option"
                    onclick="topup(100)"
                >
                    100 PT
                </button>

                <button
                    class="topup-option"
                    onclick="topup(500)"
                >
                    500 PT
                </button>

                <button
                    class="topup-option"
                    onclick="topup(1000)"
                >
                    1000 PT
                </button>

                <button
                    class="topup-option"
                    onclick="topup(2500)"
                >
                    2500 PT
                </button>

            </div>

            <div class="modal-buttons" style="margin-top: 15px;">

                <button
                    class="cancel"
                    type="button"
                    onclick="closeTopup()"
                >
                    Закрыть
                </button>

            </div>

        </div>

    </div>


    <script>

        // ==========================================
        // TELEGRAM
        // ==========================================

        const tg = window.Telegram.WebApp;

        tg.ready();
        tg.expand();


        // ==========================================
        // API
        // ==========================================

        const API = "https://telegram-appp.onrender.com";

        const initData = tg.initData;


        // ==========================================
        // VARIABLES
        // ==========================================

        let currentUser = null;

        let selectedProduct = null;
        let selectedPrice = 0;

        let selectedQuantity = 1;
        let selectedQuantityEnabled = false;
        let selectedMaxQuantity = 1;


        // ==========================================
        // API FUNCTION
        // ==========================================

        async function api(endpoint, body = {}) {

            try {

                const response = await fetch(API + endpoint, {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        ...body,
                        initData: initData
                    })

                });

                const data = await response.json();

                if (!response.ok) {

                    throw new Error(
                        data.error || "Ошибка сервера"
                    );

                }

                return data;

            } catch (error) {

                console.error("API ERROR:", error);

                throw error;

            }

        }


        // ==========================================
        // PROFILE
        // ==========================================

        async function loadProfile() {

            try {

                const data = await api("/api/profile");

                currentUser = data.user;

                updateBalance();

                document.getElementById("profileName").textContent =
                    currentUser.username
                    ? "@" + currentUser.username
                    : (currentUser.first_name || "Пользователь");

                document.getElementById("profileBalance").textContent =
                    Number(currentUser.balance || 0).toLocaleString("ru-RU");

            } catch (error) {

                console.error(error);

                document.getElementById("profileName").textContent =
                    "Ошибка загрузки";

            }

        }


        // ==========================================
        // BALANCE
        // ==========================================

        function updateBalance() {

            const balance = Number(
                currentUser?.balance || 0
            );

            document.getElementById("headerBalance").textContent =
                balance.toLocaleString("ru-RU");

            document.getElementById("profileBalance").textContent =
                balance.toLocaleString("ru-RU");

        }


        // ==========================================
        // PRODUCTS
        // ==========================================

        async function loadProducts() {

            const container =
                document.getElementById("products");

            try {

                const response = await fetch(
                    API + "/api/products"
                );

                const products = await response.json();

                container.innerHTML = "";

                if (!products.length) {

                    container.innerHTML =
                        '<div class="empty">Товаров пока нет</div>';

                    return;

                }


                products.forEach(product => {

                    const card =
                        document.createElement("div");

                    card.className = "product";


                    // Иконка
                    let icon = "📦";

                    if (product.escort) {
                        icon = "🤝";
                    } else if (
                        product.name.toLowerCase().includes("фулл")
                    ) {
                        icon = "🛡️";
                    } else if (
                        product.name.toLowerCase().includes("оруж")
                    ) {
                        icon = "🔫";
                    }


                    card.innerHTML = `

                        <div class="product-icon">
                            ${icon}
                        </div>

                        <div class="product-name">
                            ${escapeHtml(product.name)}
                        </div>

                        <div class="product-price">
                            ${Number(product.price).toLocaleString("ru-RU")} PT
                            ${
                                product.quantityEnabled
                                    ? " / шт."
                                    : ""
                            }
                        </div>

                        <button class="order" type="button">
                            Купить
                        </button>

                    `;


                    const orderButton =
                        card.querySelector(".order");

                    orderButton.addEventListener(
                        "click",
                        () => openBuy(product)
                    );


                    container.appendChild(card);

                });


            } catch (error) {

                console.error(error);

                container.innerHTML = `
                    <div class="empty">
                        ❌ Не удалось загрузить товары
                    </div>
                `;

            }

        }


        // ==========================================
        // OPEN BUY
        // ==========================================

        function openBuy(product) {

            selectedProduct = product.name;

            selectedPrice = Number(product.price) || 0;

            selectedQuantity = 1;

            selectedQuantityEnabled =
                Boolean(product.quantityEnabled);

            selectedMaxQuantity =
                Number(product.maxQuantity) || 1;


            document.getElementById("buyProduct").textContent =
                product.name;


            document.getElementById("buyPrice").textContent =
                selectedPrice.toLocaleString("ru-RU") + " PT";


            document.getElementById("gameId").value = "";


            const quantityBox =
                document.getElementById("quantityBox");


            if (selectedQuantityEnabled) {

                quantityBox.style.display = "block";

            } else {

                quantityBox.style.display = "none";

            }


            updateQuantityUI();

            updateBuyTotal();


            document
                .getElementById("buyModal")
                .classList.add("show");

        }


        // ==========================================
        // CLOSE BUY
        // ==========================================

        function closeBuy() {

            document
                .getElementById("buyModal")
                .classList.remove("show");

        }


        // ==========================================
        // QUANTITY
        // ==========================================

        function changeQuantity(amount) {

            if (!selectedQuantityEnabled) {

                selectedQuantity = 1;

                return;

            }


            let newQuantity =
                selectedQuantity + amount;


            if (newQuantity < 1) {
                newQuantity = 1;
            }


            if (newQuantity > selectedMaxQuantity) {
                newQuantity = selectedMaxQuantity;
            }


            selectedQuantity = newQuantity;


            updateQuantityUI();

            updateBuyTotal();

        }


        // ==========================================
        // QUANTITY UI
        // ==========================================

        function updateQuantityUI() {

            const quantity =
                document.getElementById("buyQuantity");

            const minus =
                document.getElementById("minusQuantity");

            const plus =
                document.getElementById("plusQuantity");


            quantity.textContent =
                selectedQuantity;


            minus.disabled =
                selectedQuantity <= 1;


            plus.disabled =
                selectedQuantity >= selectedMaxQuantity;

        }


        // ==========================================
        // TOTAL PRICE
        // ==========================================

        function updateBuyTotal() {

            const quantity =
                selectedQuantityEnabled
                    ? selectedQuantity
                    : 1;


            const total =
                selectedPrice * quantity;


            document.getElementById("buyTotalPrice").textContent =
                total.toLocaleString("ru-RU") + " PT";

        }


        // ==========================================
        // CONFIRM BUY
        // ==========================================

        async function confirmBuy() {

            const gameId =
                document
                    .getElementById("gameId")
                    .value
                    .trim();


            if (!gameId) {

                tg.showAlert
                    ? tg.showAlert("❌ Введите игровой ID")
                    : alert("❌ Введите игровой ID");

                return;

            }


            if (!selectedProduct) {

                return;

            }


            const quantity =
                selectedQuantityEnabled
                    ? selectedQuantity
                    : 1;


            const totalPrice =
                selectedPrice * quantity;


            if (
                !currentUser ||
                Number(currentUser.balance || 0) < totalPrice
            ) {

                tg.showAlert
                    ? tg.showAlert(
                        "❌ Недостаточно PT для покупки"
                    )
                    : alert(
                        "❌ Недостаточно PT для покупки"
                    );

                return;

            }


            try {

                const result =
                    await api("/api/buy", {

                        product: selectedProduct,

                        gameId: gameId,

                        quantity: quantity

                    });


                if (result.user) {

                    currentUser = result.user;

                } else {

                    currentUser.balance -= totalPrice;

                }


                updateBalance();


                closeBuy();


                let message =
                    "✅ Заказ успешно создан!\n\n" +
                    "Товар: " + selectedProduct + "\n" +
                    "Количество: " + quantity + " шт.\n" +
                    "Списано: " +
                    totalPrice.toLocaleString("ru-RU") +
                    " PT";


                if (result.orderId) {

                    message +=
                        "\nНомер заказа: #" +
                        result.orderId;

                }


                tg.showAlert
                    ? tg.showAlert(message)
                    : alert(message);


                loadHistory();


            } catch (error) {

                tg.showAlert
                    ? tg.showAlert(
                        "❌ " + error.message
                    )
                    : alert(
                        "❌ " + error.message
                    );

            }

        }


        // ==========================================
        // TOP UP
        // ==========================================

        function openTopup() {

            document
                .getElementById("topupModal")
                .classList.add("show");

        }


        function closeTopup() {

            document
                .getElementById("topupModal")
                .classList.remove("show");

        }


        async function topup(amount) {

            try {

                const result =
                    await api("/api/topup", {

                        amount: amount

                    });


                if (result.url) {

                    tg.openLink(result.url);

                } else {

                    tg.showAlert
                        ? tg.showAlert(
                            "❌ Не удалось создать платёж"
                        )
                        : alert(
                            "❌ Не удалось создать платёж"
                        );

                }

            } catch (error) {

                tg.showAlert
                    ? tg.showAlert(
                        "❌ " + error.message
                    )
                    : alert(
                        "❌ " + error.message
                    );

            }

        }


        // ==========================================
        // HISTORY
        // ==========================================

        async function loadHistory() {

            const container =
                document.getElementById("historyList");


            try {

                const data =
                    await api("/api/history");


                const orders =
                    data.orders || data || [];


                container.innerHTML = "";


                if (!orders.length) {

                    container.innerHTML =
                        '<div class="empty">Заказов пока нет</div>';

                    return;

                }


                orders.forEach(order => {

                    const item =
                        document.createElement("div");

                    item.className = "history-item";


                    const quantity =
                        Number(order.quantity || 1);


                    const price =
                        Number(order.price || 0);


                    item.innerHTML = `

                        <div class="history-product">
                            ${escapeHtml(
                                order.product || "Товар"
                            )}
                        </div>

                        <div class="history-info">

                            Количество:
                            ${quantity} шт.<br>

                            Сумма:
                            ${price.toLocaleString("ru-RU")} PT<br>

                            Game ID:
                            ${escapeHtml(
                                String(order.gameId || "-")
                            )}<br>

                            Статус:
                            ${escapeHtml(
                                order.status || "Ожидание"
                            )}

                        </div>

                    `;


                    container.appendChild(item);

                });


            } catch (error) {

                console.error(error);

                container.innerHTML = `
                    <div class="empty">
                        ❌ Не удалось загрузить историю
                    </div>
                `;

            }

        }


        // ==========================================
        // SECTIONS
        // ==========================================

        function showSection(section) {

            document
                .querySelectorAll(".section")
                .forEach(el => {
                    el.classList.remove("active");
                });


            document
                .getElementById(section)
                .classList.add("active");


            document
                .querySelectorAll(".menu button")
                .forEach(button => {
                    button.classList.remove("active");
                });


            if (section === "shop") {

                document
                    .getElementById("shopBtn")
                    .classList.add("active");

            }

            if (section === "profile") {

                document
                    .getElementById("profileBtn")
                    .classList.add("active");

            }

            if (section === "history") {

                document
                    .getElementById("historyBtn")
                    .classList.add("active");

                loadHistory();

            }

        }


        // ==========================================
        // ESCAPE HTML
        // ==========================================

        function escapeHtml(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        // ==========================================
        // CLOSE MODALS BY BACKGROUND
        // ==========================================

        document
            .getElementById("buyModal")
            .addEventListener("click", function(event) {

                if (event.target === this) {

                    closeBuy();

                }

            });


        document
            .getElementById("topupModal")
            .addEventListener("click", function(event) {

                if (event.target === this) {

                    closeTopup();

                }

            });


        // ==========================================
        // START
        // ==========================================

        loadProfile();

        loadProducts();

    </script>

</body>
